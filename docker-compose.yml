services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vartma
      POSTGRES_USER: vartma
      POSTGRES_PASSWORD: vartma
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vartma -d vartma"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vartma-postgres-data:/var/lib/postgresql/data

volumes:
  vartma-postgres-data:
